{% extends "base.html" %}
{% block title %}Profile | Mr. Computers{% endblock %}
{% block content %}
<div class="narrow-page">
    <span class="eyebrow"><a href="{% url "accounts:overview" %}"><i class="bi bi-arrow-left"></i> Go Back</a></span>
    <h1>Profile</h1>
    <form method="post" class="form-section">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="first-name">First name</label>
            <input class="form-control" id="first-name" name="first_name" value="{{ request.user.first_name }}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="last-name">Last name</label>
            <input class="form-control" id="last-name" name="last_name" value="{{ request.user.last_name }}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" value="{{ request.user.email }}">
        </div>
        <button class="btn btn-primary" type="submit">Save profile</button>
    </form>
</div>
{% endblock %}
